			 					</span>

<script language="javascript">
	//是否启用APP下载二维码
	
	function ReShowCode(){
		var SafeCodeImg = document.getElementById("SafeCodeImg");
		var url="/gzasc_jsxsd/verifycode.servlet?t="+Math.random();
		SafeCodeImg.src = url;
	}

	function login2(){
		var url='http://cas.ncbcjxau.edu.cn:7002/cas/login';
		document.Form1.action=url;
		document.Form1.submit();
	}
	function login1(){
		var url='https://jwxt.ncbcjxau.edu.cn:8443/jsxsd/indexx.jsp';
		//var url = '/gzasc_jsxsd/indexx.jsp';
		document.Form1.action=url;
		document.Form1.submit();
	}
	
	function submitForm1(){
		try{
			var xh = document.getElementById("userAccount").value;
			var pwd = document.getElementById("userPassword").value;
			if(xh==""){
				alert("用户名不能为空！");
				return false;
			}
			if(pwd==""){
				alert("密码不能为空！");
				return false;
			}
			var account = encodeInp(xh);
			var passwd = encodeInp(pwd);
			var encoded = account+"%%%"+passwd;
			document.getElementById("encoded").value = encoded;
			var jzmmid = document.getElementById("Form1").jzmmid;
			document.getElementById("userPassword").value="";
			return true;
		}catch(e){
			alert(e);
			return false;
		}
	}


	/***
	 *切换验证码
	 **/
	function QRcodeFun(type) {
		if("1" == type ){
			$("#ul1").hide();
			$("#ul2").show();
			$("#QRcodeSkip").hide();
		}else{
			$("#ul2").hide();
			$("#ul1").show();
			$("#QRcodeSkip").show();
		}

	}
</script>
